<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지구본 3D 태양 시뮬레이터</title>
<style>
:root{
  --bg:#05060a; --panel:rgba(15,18,26,.88); --line:#262c3b; --text:#e8ebf2; --dim:#8b93a7;
  --hot:#ffa24a; --yellow:#ffd23d; --blue:#8fdcff; --panelW:316px;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}

#title{position:fixed;left:20px;top:16px;pointer-events:none;max-width:calc(100% - var(--panelW) - 72px)}
#title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
#title p{margin:4px 0 0;font-size:12px;color:var(--dim)}

#panel{position:fixed;right:16px;top:16px;width:var(--panelW);max-height:calc(100% - 32px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;backdrop-filter:blur(8px)}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.p-head .btns{display:flex;gap:6px;flex:none}
button{font-family:inherit;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;font-size:11px;padding:4px 9px;white-space:nowrap}
button.ghost:hover{color:var(--text);border-color:#3a4256}
#citySel{flex:1;min-width:0;background:#10131c;color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;padding:7px 8px}
#citySel:focus{outline:1px solid var(--hot)}
#citySel optgroup{color:#8b93a7;font-style:normal}
#citySel option{color:#e8ebf2;background:#10131c}

.person{margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(143,220,255,.05)}
.person .ph{font-size:12px;color:var(--blue);margin-bottom:6px;letter-spacing:.2px;line-height:1.35}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;font-size:12px;color:var(--dim)}
.pr b{color:var(--text);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.pr b#vEl{font-size:20px;font-weight:700;color:var(--hot)}
.pr b.day{color:#ffd58a}.pr b.twi{color:#ff9a6a}.pr b.night{color:#8aa0d6}
.pr b#vDN{font-size:16px;font-weight:700}
.tzline{font-size:10.5px;color:#68718a;text-align:right;margin:-2px 0 2px}

.meter{margin:6px 0 2px}
.meter-track{position:relative;height:8px;border-radius:5px;background:linear-gradient(90deg,#1a2342 0,#1a2342 50%,#4a3318 50%,#4a3318 100%);border:1px solid var(--line)}
.meter-tick{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:#8b93a7;opacity:.8}
.meter-dot{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,162,74,.45);left:50%}
.meter-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--dim)}

#detail{border-top:1px solid var(--line);padding-top:8px}
#detail .pr b{font-size:13px}
#detail .pr.long{display:block}
#detail .pr.long b{display:block;text-align:left;margin-top:2px;line-height:1.4}
#panel.collapsed #detail{display:none}

#legend{position:fixed;left:20px;top:76px;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim);pointer-events:none}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-12px);max-width:min(560px,calc(100% - 24px));padding:9px 14px;border-radius:10px;background:rgba(20,26,44,.92);border:1px solid var(--line);color:var(--text);font-size:12px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
#legend .rayleg{display:none}
body.rays-on #legend .rayleg{display:block}
#legend .r1 i{background:#ff8a2a;box-shadow:0 0 6px #ff8a2a}#legend .r2 i{background:#fff;box-shadow:0 0 5px #fff}
#legend .rn{font-size:10px;opacity:.75;line-height:1.35;max-width:210px;margin-top:2px}
#legend .a i{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}#legend .b i{background:var(--hot)}#legend .c i{background:#cfd6e8;border-radius:2px;width:3px;height:12px;margin:0 9px 0 3px;vertical-align:-2px}

#bar{position:fixed;left:16px;right:calc(var(--panelW) + 32px);bottom:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px 12px;backdrop-filter:blur(8px)}
#bar .row{display:flex;align-items:center;gap:14px}
#bar .row.wrap{flex-wrap:wrap;margin-top:8px;gap:8px 22px}
button.primary{background:var(--hot);color:#1a1006;border:0;border-radius:10px;font-weight:700;font-size:13px;padding:9px 14px;min-width:104px;white-space:nowrap}
button.primary:hover{filter:brightness(1.08)}
.sliderWrap{flex:1;position:relative;padding-bottom:16px;min-width:140px;margin:0 8px}
.marks{position:absolute;left:0;right:0;top:20px;height:14px;pointer-events:none}
.marks span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap}
.marks span:last-child{transform:translateX(-100%)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,#2a2f3d,#3a2c1c 47%,#2a2f3d 72%,#1d2a40 97%)}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:#2a2f3d}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 3px rgba(255,162,74,.5);border:0}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(255,162,74,.5)}
.dayNo{min-width:84px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayNo b{font-size:18px;display:block;line-height:1.15}.dayNo small{color:var(--dim);font-size:11px}
.group{display:flex;align-items:center;gap:8px;min-width:0}
.group label{font-size:11px;color:var(--dim);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{white-space:nowrap;background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim);font-size:12px;padding:7px 10px}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(255,162,74,.18);color:var(--hot);font-weight:700}
button.ghost.now{font-size:12px;padding:7px 10px;color:var(--hot);border-color:rgba(255,162,74,.45)}
button.ghost.now:hover{background:rgba(255,162,74,.14);border-color:var(--hot)}

#hint{position:fixed;left:20px;bottom:calc(var(--barH,130px) + 28px);font-size:11px;color:#59617a;pointer-events:none}

@media (max-width:900px){
  :root{--panelW:280px}
}
@media (max-width:720px){
  #title{left:12px;top:10px;max-width:calc(100% - 24px)}
  #title h1{font-size:15px}#title p,#hint{display:none}
  body.rays-on #legend .rayleg.rn{display:none}
  #legend{flex-wrap:wrap;gap:3px 12px;font-size:10.5px}#legend span{white-space:nowrap}
  #legend{left:12px;top:auto;bottom:calc(var(--barH,150px) + 26px);flex-direction:row;gap:12px}
  #panel{left:10px;right:10px;top:38px;width:auto;max-height:none;padding:8px 10px 10px;overflow:visible}
  .p-head{margin-bottom:6px}
  .person{padding:7px 10px;margin-bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .person .ph,.person .tzline,.person .meter,.person .pr.wide{grid-column:1/-1}
  .person .ph{margin-bottom:2px;font-size:11.5px}
  .pr{padding:2px 0}.pr b{font-size:13px}.pr b#vEl{font-size:16px}.pr b#vDN{font-size:14px}
  .tzline{display:none}
  .meter{margin:4px 0 0}.meter-ends{display:none}
  #bar{left:10px;right:10px;bottom:10px;padding:8px 10px 10px}
  #bar .row{gap:8px}#bar .row.wrap{gap:6px 10px;margin-top:6px}
  .marks{display:none}.sliderWrap{padding-bottom:0;min-width:80px;margin:0 4px}
  .group label{display:none}
  .seg button{padding:6px 8px;font-size:11px}
  #speedSeg,#viewSeg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  #speedSeg::-webkit-scrollbar,#viewSeg::-webkit-scrollbar{display:none}
  button.primary{min-width:0;padding:8px 10px}
  .dayNo{min-width:64px}.dayNo b{font-size:15px}
  #bar .group.sp{flex:1 1 100%}
}

</style>
</head>
<body>
<div id="stage"></div>

<header id="title">
  <h1 data-i18n="title">지구본 · 태양 시뮬레이터</h1>
  <p data-i18n="subtitle">고정된 태양빛 아래에서 지축 23.44°로 자전하는 지구</p>
</header>
<div id="toast" role="status" aria-live="polite"></div>
<div id="legend"><span class="a"><i></i><span data-i18n="legSub">태양 바로 아래</span></span><span class="b"><i></i><span data-i18n="legCity">선택한 도시</span></span><span class="c"><i></i><span data-i18n="legAxis">지축 (N = 북극)</span></span><span class="rayleg r1"><i></i><span data-i18n="legAbs">흡수(주황 번쩍)</span></span><span class="rayleg r2"><i></i><span data-i18n="legRef">반사(흰 줄기)</span></span><span class="rayleg rn" data-i18n-html="rayNote">개념 설명용 그림</span></div>

<aside id="panel" data-i18n-aria="panelAria" aria-label="도시 정보 패널">
  <div class="p-head">
    <select id="citySel" data-i18n-aria="citySel" aria-label="도시 선택"></select>
    <span class="btns"><button id="btnLang" class="ghost" aria-label="Language">EN</button><button id="panelToggle" class="ghost">자세히</button></span>
  </div>

  <div class="person">
    <div class="ph" id="vPh">—</div>
    <div class="pr"><span data-i18n="pE">태양 고도</span><b id="vEl">—</b></div>
    <div class="pr"><span data-i18n="pS">지금은</span><b id="vDN" class="day">—</b></div>
    <div class="pr wide"><span data-i18n="pT">현지 시각</span><b id="vLocal">—</b></div>
    <div class="pr wide"><span data-i18n="pL">낮의 길이</span><b id="vLen">—</b></div>
    <div class="tzline" id="vTz"></div>
    <div class="meter">
      <div class="meter-track"><div class="meter-tick"></div><div class="meter-dot" id="mDot"></div></div>
      <div class="meter-ends"><span>−90° <span data-i18n="elS">아래 (밤)</span></span><span data-i18n="horizon">지평선</span><span>+90° <span data-i18n="elN">위 (낮)</span></span></div>
    </div>
  </div>

  <div id="detail">
    <div class="pr"><span data-i18n="rSubLat">태양 바로 아래 위도</span><b id="vSubLat">—</b></div>
    <div class="pr"><span data-i18n="rSubLon">태양 바로 아래 경도</span><b id="vSubLon">—</b></div>
    <div class="pr"><span data-i18n="rUtc">세계 표준시(UTC)</span><b id="vUtc">—</b></div>
    <div class="pr long"><span data-i18n="rAxis">지축과 태양</span><b id="vAxis">—</b><b id="vSeason" style="color:var(--dim);font-size:12px;font-weight:400">—</b></div>
  </div>
</aside>

<section id="bar">
  <div class="row">
    <button id="btnPlay" class="primary" data-i18n-aria="playAria" aria-label="재생 또는 일시정지">⏸ 일시정지</button>
    <div class="sliderWrap">
      <input id="sDay" type="range" min="0" max="365" step="1" value="0" data-i18n-aria="dayAria" aria-label="날짜 슬라이더">
      <div class="marks">
        <span style="left:21.8%" data-i18n="m0">3/21경 춘분</span>
        <span style="left:47%" data-i18n="m1">6/21경 하지</span>
        <span style="left:71.8%" data-i18n="m2">9/21경 추분</span>
        <span style="left:96.8%" data-i18n="m3">12/21경 동지</span>
      </div>
    </div>
    <div class="dayNo"><b id="vDate">—</b><small id="vTime">—</small></div>
  </div>
  <div class="row wrap">
    <div class="group sp"><label data-i18n="lblSpeed">재생 속도</label>
      <div class="seg" id="speedSeg"></div>
      <button id="btnNow" class="ghost now" data-i18n="now" data-i18n-title="nowT">지금 시각으로</button>
    </div>
    <div class="group"><label data-i18n="lblView">시점</label>
      <div class="seg" id="viewSeg">
        <button data-v="side" data-i18n="vSide" data-i18n-title="vSideT">옆에서 보기</button>
        <button data-v="sun" data-i18n="vSun" data-i18n-title="vSunT">태양 쪽에서</button>
        <button data-v="top" data-i18n="vTop" data-i18n-title="vTop2">북극 위에서</button>
        <button data-v="auto" id="btnAuto" data-i18n="vAuto">자동 회전</button>
        <button id="btnFlip" data-i18n="vFlip" data-i18n-title="vFlipT">시점 자동 전환</button>
        <button id="btnRays" data-i18n="vRays" data-i18n-title="vRaysT">광선 모션</button>
      </div>
    </div>
  </div>
</section>

<div id="hint" data-i18n="hint">드래그: 회전 · 휠/핀치: 확대 · 지구본의 점을 누르면 도시 선택</div>

/* ===== 00 설정 · 태양 계산 (평면 모델과 나란히 비교할 때 이 모듈을 공유) =====
   좌표계: 태양은 +X 방향에 고정. 지구본은 (1) 지축 기울기(적위) → (2) 자전 순서로 회전한다.
   T = 1월 1일 0:00(UTC)부터 지난 날수(소수). 날짜 슬라이더는 floor(T), 하루 중 시각은 T의 소수부. */
const FE = window.FE = {};
FE.CFG = {
  TILT: 23.44,                 // 지축 기울기(°)
  YEAR: 365.24,                // 1년(일)
  EQUINOX_T: 79.5,             // 춘분 기준일(3/21 정오 부근) — 적위 0°가 되는 T
  DAY_WRAP: 366,               // 슬라이더 0~365 → T가 366이 되면 처음으로
  TWILIGHT: [-0.10, 0.16],     // 낮밤 경계의 번짐 구간(태양 방향과 지표 법선의 내적, 셰이더용)
  CIVIL_DEG: -6,               // 시민박명(고도 -6°까지를 황혼으로 표시)
  SUN_DIST: 9,                 // 태양 표시 거리(장면 단위, 지구 반지름 = 1)
  SPEEDS: [                    // 재생 속도(하루 = 1)
    ['s0', 1 / 86400], ['s1', 1 / 1440], ['s2', 1 / 24], ['s3', 1], ['s4', 10], ['s5', 30]
  ],
  DEFAULT_SPEED: 2
};
FE.rad = Math.PI / 180;
FE.clamp = (x, a, b) => Math.min(b, Math.max(a, x));
FE.wrapLon = x => ((x + 180) % 360 + 360) % 360 - 180;

FE.Solar = {
  /* 태양 적위(°) = 태양 바로 아래 지점의 위도. 하지(≈6/21)에 +23.44°, 춘·추분에 0° */
  decl(T) { return FE.CFG.TILT * Math.sin(2 * Math.PI * (T - FE.CFG.EQUINOX_T) / FE.CFG.YEAR); },
  /* 균시차(분): 시계 시각과 태양시의 차이(근사식) */
  eotMin(T) { const B = 2 * Math.PI * (T - 80) / 365; return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); },
  /* 한 시점의 태양 상태: 적위, 태양 바로 아래 경도(°E), UTC 시각 */
  state(T) {
    const frac = ((T % 1) + 1) % 1, utcH = frac * 24;
    const decl = FE.Solar.decl(T), eot = FE.Solar.eotMin(T);
    return { T, decl, eot, utcH, subLon: FE.wrapLon(-15 * (utcH - 12 + eot / 60)) };
  },
  /* sin(고도) = sinφ·sinδ + cosφ·cosδ·cosH,  H = 도시 경도 − 태양 바로 아래 경도 */
  sinElev(lat, lon, st) {
    const p = lat * FE.rad, d = st.decl * FE.rad, H = (lon - st.subLon) * FE.rad;
    return Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H);
  },
  elevation(lat, lon, st) { return Math.asin(FE.clamp(FE.Solar.sinElev(lat, lon, st), -1, 1)) / FE.rad; },
  /* 낮의 길이(시간). 백야면 24, 극야면 0 */
  dayLength(lat, decl) {
    const x = -Math.tan(lat * FE.rad) * Math.tan(decl * FE.rad);
    if (x >= 1) return 0; if (x <= -1) return 24;
    return 2 * Math.acos(x) / FE.rad / 15;
  }
};

FE.YEAR0 = new Date().getUTCFullYear();
FE.nowT = (date = new Date()) => {
  FE.YEAR0 = date.getUTCFullYear();
  return (date.getTime() - Date.UTC(FE.YEAR0, 0, 1)) / 86400000;
};
FE.dateOfT = T => new Date(Date.UTC(FE.YEAR0, 0, 1) + T * 86400000);

/* 도시 시간대(IANA) 기준 현지 날짜·시각 */
FE._fmt = {};
FE.localClock = (T, c = FE.city) => {
  const date = FE.dateOfT(T), p = {};
  let f = FE._fmt[c.tz];
  if (f === undefined) {
    try { f = FE._fmt[c.tz] = new Intl.DateTimeFormat('en-US', { timeZone: c.tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }); }
    catch (e) { f = FE._fmt[c.tz] = null; }
  }
  if (f) f.formatToParts(date).forEach(x => { p[x.type] = +x.value; });
  else {                                                      // 시간대 정보를 못 쓰면 경도(15°=1시간)로 근사
    const d = new Date(date.getTime() + c.lon / 15 * 3600000);
    p.year = d.getUTCFullYear(); p.month = d.getUTCMonth() + 1; p.day = d.getUTCDate(); p.hour = d.getUTCHours(); p.minute = d.getUTCMinutes(); p.second = d.getUTCSeconds();
  }
  const asUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second);
  const offMin = Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000 / 15) * 15;
  return { y: p.year, m: p.month, d: p.day, h: p.hour % 24, mi: p.minute, s: p.second, offMin };
};
FE.fmt2 = n => (n < 10 ? '0' : '') + n;
FE.utcOffsetStr = m => 'UTC' + (m < 0 ? '−' : '+') + Math.floor(Math.abs(m) / 60) + (Math.abs(m) % 60 ? ':' + FE.fmt2(Math.abs(m) % 60) : '');

/* 저장(기기 안에서만) — 저장소를 못 쓰는 환경(미리보기 등)에서도 오류 없이 동작 */
FE.store = {
  get(k) { try { return localStorage.getItem('fe.globe.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('fe.globe.' + k, v); } catch (e) {} }
};

FE.CITIES = FE.CITY_ROWS.map(r => ({ id: r[0], ko: r[1], en: r[2], lat: r[3], lon: r[4], tz: r[5], reg: r[6] }));
FE.REGIONS = ['kr', 'as', 'me', 'eu', 'ru', 'na', 'la', 'af', 'oc', 'pl'];
FE.cityName = (c = FE.city) => c[FE.lang];
FE.latStr = (v, d = 1) => FE.t(v >= 0 ? 'latN' : 'latS', { v: Math.abs(v).toFixed(d) });
FE.lonStr = (v, d = 1) => FE.t(v >= 0 ? 'lonE' : 'lonW', { v: Math.abs(v).toFixed(d) });
FE.fmtDate = (m, d) => FE.t('dateF', { m: FE.lang === 'en' ? FE.MONTHS_EN[m - 1] : m, d });

FE.initLocale = () => {
  const q = new URLSearchParams(location.search);
  const dev = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ko').toLowerCase();
  const l = q.get('lang') || FE.store.get('lang') || (dev.startsWith('ko') ? 'ko' : 'en');
  FE.lang = l === 'ko' ? 'ko' : 'en';
  let c = FE.CITIES.find(x => x.id === (q.get('city') || FE.store.get('city')));
  if (!c) {                                    // 처음 실행: 기기 시간대와 같은 도시가 있으면 그 도시, 없으면 서울
    let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    c = FE.CITIES.find(x => x.tz === tz) || FE.CITIES[0];
  }
  FE.city = c;
};
FE.applyI18n = () => {
  document.documentElement.lang = FE.lang; document.title = FE.t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = FE.t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = FE.t(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = FE.t(e.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', FE.t(e.dataset.i18nAria)); });
};
FE.setLang = l => { FE.lang = l; FE.store.set('lang', l); FE.onChange ? FE.onChange() : FE.applyI18n(); };
FE.pickCity = id => {
  const c = FE.CITIES.find(x => x.id === id); if (!c) return;
  FE.city = c; FE.store.set('city', id); FE.onChange && FE.onChange();
};
FE.buildCitySelect = () => {
  const sel = document.getElementById('citySel'); if (!sel) return;
  sel.textContent = '';
  FE.REGIONS.forEach(r => {
    const g = document.createElement('optgroup'); g.label = FE.t('r_' + r);
    FE.CITIES.filter(c => c.reg === r).forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = FE.cityName(c); g.appendChild(o); });
    sel.appendChild(g);
  });
  sel.value = FE.city.id;
};

/* ===== 20 조명: 고정 평행광(태양) · 낮밤 경계의 황혼 번짐 · 태양 직하점 · 별 =====
   태양은 +X 방향에 고정. DirectionalLight의 위치가 곧 태양 방향이며, 지구본 셰이더도 이 방향을 읽어 낮/밤을 칠한다. */
FE.Lighting = (() => {
  const U = { sunDir: { value: new THREE.Vector3(1, 0, 0) }, tw: { value: new THREE.Vector2(FE.CFG.TWILIGHT[0], FE.CFG.TWILIGHT[1]) } };

  const EARTH_VS = `
    varying vec3 vN; varying vec2 vUv;
    void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  /* 낮: 태양을 향한 면일수록 밝게 · 밤: 매우 어둡게 · 경계(ndl≈0): smoothstep으로 부드럽게 섞고 붉은 황혼빛을 얹음 */
  const EARTH_FS = `
    precision highp float;
    uniform sampler2D map; uniform vec3 sunDir; uniform vec2 tw;
    varying vec3 vN; varying vec2 vUv;
    void main(){
      vec3 n = normalize(vN);
      float ndl = dot(n, normalize(sunDir));
      vec3 tex = texture2D(map, vUv).rgb;
      float day = smoothstep(tw.x, tw.y, ndl);
      vec3 lit = tex * (0.58 + 0.60 * clamp(ndl, 0.0, 1.0));
      vec3 night = tex * vec3(0.085, 0.105, 0.17);
      vec3 col = mix(night, lit, day);
      float band = exp(-pow((ndl - 0.03) / 0.085, 2.0));
      col = mix(col, col * vec3(1.25, 0.82, 0.62), band * 0.55);
      col += vec3(1.0, 0.40, 0.12) * band * 0.16 * (0.35 + dot(tex, vec3(0.33)));
      gl_FragColor = vec4(col, 1.0);
    }`;
  const ATM_VS = `
    varying vec3 vN; varying vec3 vW;
    void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
  /* 유리막: 지구 전체를 덮는 얇은 투명 구. 가장자리일수록 진하게(프레넬), 태양 쪽엔 반사광(하이라이트) */
  const GLASS_FS = `
    precision highp float;
    uniform vec3 sunDir; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 n = normalize(vN), v = normalize(cameraPosition - vW), s = normalize(sunDir);
      float ndv = clamp(dot(n, v), 0.0, 1.0);
      float fres = pow(1.0 - ndv, 2.2);
      float lit = smoothstep(-0.30, 0.50, dot(n, s));
      vec3 tint = mix(vec3(0.62, 0.66, 0.74), vec3(0.97, 0.98, 1.0), lit);
      float a = (0.015 + 0.28 * fres) * (0.55 + 0.45 * lit);
      vec3 h = normalize(s + v);
      float spec = pow(clamp(dot(n, h), 0.0, 1.0), 220.0) * lit;
      vec3 col = tint + vec3(0.7) * spec;
      gl_FragColor = vec4(col, clamp(a + spec * 0.35, 0.0, 0.9));
    }`;
  /* 대기: 지구보다 약간 큰 구의 '안쪽 면'을 그려서, 지구 테두리에서 가장 밝고 바깥으로 갈수록 투명하게 사라지게 함(딱딱한 고리가 보이지 않음) */
  const ATM_FS = `
    precision highp float;
    uniform vec3 sunDir; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 n = normalize(vN), v = normalize(cameraPosition - vW);
      float a = clamp(-dot(n, v), 0.0, 1.0);
      float lit = smoothstep(-0.35, 0.45, dot(n, normalize(sunDir)));
      float k = pow(a, 1.6) * (0.14 + 0.86 * lit) * 0.8;
      gl_FragColor = vec4(vec3(0.92, 0.95, 1.0) * k, k);
    }`;

  function earthMaterial(tex) {
    return new THREE.ShaderMaterial({ uniforms: { map: { value: tex }, sunDir: U.sunDir, tw: U.tw }, vertexShader: EARTH_VS, fragmentShader: EARTH_FS });
  }

  function glowTexture(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  }

  function create(scene) {
    const dist = FE.CFG.SUN_DIST;
    const light = new THREE.DirectionalLight(0xfff2dc, 1.0);          // 고정된 평행광
    light.position.set(dist, 0, 0); light.target.position.set(0, 0, 0);
    scene.add(light, light.target);
    scene.add(new THREE.AmbientLight(0x1b2540, 0.6));
    const sync = () => U.sunDir.value.copy(light.position).normalize();
    sync();

    // 태양(방향 표시용 · 실제 크기/거리가 아님)
    const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture([[0, 'rgba(255,255,240,1)'], [0.18, 'rgba(255,226,140,.95)'], [0.45, 'rgba(255,170,60,.35)'], [1, 'rgba(255,140,40,0)']]), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    sunSpr.position.copy(light.position); sunSpr.scale.set(3.2, 3.2, 1); scene.add(sunSpr);

/* ===== 10 지구본: 구 · 지축 기울기 · 자전 · 해안선/국경/격자 텍스처 · 도시 점 =====

    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), FE.Lighting.earthMaterial(tex)); spin.add(earth);

    FE.CITIES.forEach((c, i) => { const v = dir(c.lat, c.lon, 1.0035); cp[i * 3] = v.x; cp[i * 3 + 1] = v.y; cp[i * 3 + 2] = v.z; });

    tilt.add(new THREE.Line(axG, new THREE.LineBasicMaterial({ color: 0xcfd6e8, transparent: true, opacity: 0.75 })));

      setCity(c) { marker.position.copy(dir(c.lat, c.lon, 1.003)); marker.lookAt(marker.position.clone().multiplyScalar(2)); },
      animate(time) { const s = 1 + 0.5 * ((time * 1.1) % 1); pulse.scale.setScalar(s); pulse.material.opacity = 0.9 * (1 - ((time * 1.1) % 1)); },

/* ===== 25 광선 모션: 태양빛이 날아와 구름·지표에 닿아 반사되거나 흡수되는 모습(개념 설명용 그림) =====

   - 지표: 바다는 대부분 흡수(비스듬히 닿을수록 거울 반사 ↑, 슐릭 근사), 육지 약 22% 흩어짐, 얼음 약 80% 반사
   - 흡수되면 닿은 자리에 주황빛 번쩍임. 속도·크기는 실제가 아닌 시각 효과. 계산(고도·낮/밤)과는 무관 */

    }

    }

    parts.forEach(q => spawn(q, true));

    const api = {
      group, stats, enabled: true,
      setEnabled(on) { api.enabled = on; group.visible = on; if (lighting.rays) lighting.rays.visible = !on; },
      resetStats() { for (const k in stats) stats[k] = 0; },
      update(dt) {
        for (let i = 0; i < N; i++) {
          const q = parts[i];
          if (q.state === 0) {
            const next = q.trav + SPEED * dt;
            if (q.cloudS !== null && next >= q.cloudS) { q.trav = q.cloudS; place(q); atCloud(q); }
            else if (q.surfS !== null && next >= q.surfS) { q.trav = q.surfS; place(q); atSurface(q); }
            else { q.trav = next; place(q); if (q.trav > q.end) spawn(q, false); }
          } else {
            q.age += dt; q.p.addScaledVector(q.v, dt); if (q.age >= q.max) spawn(q, false);
          }
          // 그리기: 머리(밝음) → 꼬리(어둡게 = 투명)
          let al, dx, dy, dz, len;
          if (q.state === 0) { al = Math.min(1, q.trav / 0.9) * 0.9; dx = toward.x; dy = toward.y; dz = toward.z; len = STREAK; }
          else { al = (1 - q.age / q.max) * 0.95; const s = 1 / RSPEED; dx = q.v.x * s; dy = q.v.y * s; dz = q.v.z * s; len = RSTREAK; }
          const c = q.col, x = q.p.x, y = q.p.y, z = q.p.z;
          hp[i * 3] = x; hp[i * 3 + 1] = y; hp[i * 3 + 2] = z; hc[i * 3] = c[0] * al; hc[i * 3 + 1] = c[1] * al; hc[i * 3 + 2] = c[2] * al;
          lp[i * 6] = x; lp[i * 6 + 1] = y; lp[i * 6 + 2] = z; lp[i * 6 + 3] = x - dx * len; lp[i * 6 + 4] = y - dy * len; lp[i * 6 + 5] = z - dz * len;
          lc[i * 6] = c[0] * al; lc[i * 6 + 1] = c[1] * al; lc[i * 6 + 2] = c[2] * al; lc[i * 6 + 3] = lc[i * 6 + 4] = lc[i * 6 + 5] = 0;
        }
        for (let j = 0; j < M; j++) {
          fage[j] += dt; const k = Math.max(0, 1 - fage[j] / 0.5), f = k * k;
          fc[j * 3] = fbase[j * 3] * f; fc[j * 3 + 1] = fbase[j * 3 + 1] * f; fc[j * 3 + 2] = fbase[j * 3 + 2] * f;
        }
        heads.geometry.attributes.position.needsUpdate = heads.geometry.attributes.color.needsUpdate = true;
        lines.geometry.attributes.position.needsUpdate = lines.geometry.attributes.color.needsUpdate = true;
        flashes.geometry.attributes.position.needsUpdate = flashes.geometry.attributes.color.needsUpdate = true;
      }
    };
    return api;
  }
  return { create };
})();

/* ===== 30 패널: 선택한 도시의 태양 고도 · 낮/밤 · 현지 시각 + 지구 상태 ===== */
FE.Panel = {
  create() {
    const $ = id => document.getElementById(id);
    const el = { ph: $('vPh'), elv: $('vEl'), dn: $('vDN'), loc: $('vLocal'), tz: $('vTz'), len: $('vLen'), dot: $('mDot'), fill: $('mFill'),
      sLat: $('vSubLat'), sLon: $('vSubLon'), axis: $('vAxis'), season: $('vSeason'), utc: $('vUtc'), date: $('vDate'), time: $('vTime') };
    let last = 0;
    const api = {
      setCity() {
        const c = FE.city;
        el.ph.textContent = FE.t('ph', { city: FE.cityName(c), lat: FE.latStr(c.lat), lon: FE.lonStr(c.lon) });
      },
      /* 모든 값은 FE.Solar에서 계산 → 지구본(셰이더)과 같은 기하에서 나온 값 */
      update(st, force) {
        const now = performance.now(); if (!force && now - last < 70) return; last = now;
        const c = FE.city, T = st.T;
        const e = FE.Solar.elevation(c.lat, c.lon, st);
        el.elv.textContent = (e >= 0 ? '+' : '−') + Math.abs(e).toFixed(1) + '°';
        const state = e > 0 ? 'day' : e > FE.CFG.CIVIL_DEG ? 'twi' : 'night';
        el.dn.textContent = FE.t(state); el.dn.className = state;
        el.dot.style.left = ((e + 90) / 180 * 100) + '%';
        const lc = FE.localClock(T, c);
        el.loc.textContent = FE.fmtDate(lc.m, lc.d) + ' ' + FE.fmt2(lc.h) + ':' + FE.fmt2(lc.mi) + ':' + FE.fmt2(lc.s);
        el.tz.textContent = c.tz.replace(/_/g, ' ') + ' · ' + FE.utcOffsetStr(lc.offMin);
        const dl = FE.Solar.dayLength(c.lat, st.decl);
        el.len.textContent = dl >= 24 ? FE.t('polarDay') : dl <= 0 ? FE.t('polarNight') : FE.t('lenF', { h: Math.floor(Math.round(dl * 60) / 60), m: Math.round(dl * 60) % 60 });
        el.sLat.textContent = FE.latStr(st.decl, 2); el.sLon.textContent = FE.lonStr(st.subLon, 1);
        const a = Math.abs(st.decl);
        el.axis.textContent = a < 0.5 ? FE.t('axisEq') : FE.t(st.decl > 0 ? 'axisN' : 'axisS', { v: a.toFixed(1) });
        el.season.textContent = a < 0.5 ? FE.t('seasonEq') : FE.t(st.decl > 0 ? 'seasonN' : 'seasonS');
        const d = FE.dateOfT(T);
        el.utc.textContent = FE.t('utcF', { h: FE.fmt2(d.getUTCHours()), mi: FE.fmt2(d.getUTCMinutes()) });
        el.date.textContent = FE.fmtDate(d.getUTCMonth() + 1, d.getUTCDate());
        el.time.textContent = FE.t('utcF', { h: FE.fmt2(d.getUTCHours()), mi: FE.fmt2(d.getUTCMinutes()) });
      }
    };
    return api;
  }
};

/* ===== 40 조작: 재생/일시정지 · 날짜 슬라이더 · 속도 · 지금 시각 · 시점 · 패널 접기 ===== */
FE.Controls = {
  create(state, cam, onChange) {
    const $ = id => document.getElementById(id);
    const play = $('btnPlay'), slider = $('sDay');
    let dragging = false;

    const setPlay = on => { if (!on) state.live = false; state.playing = on; play.textContent = FE.t(on ? 'pause' : 'play'); };
    play.onclick = () => setPlay(!state.playing);
    addEventListener('keydown', e => { if (e.code === 'Space' && !/^(BUTTON|SELECT|INPUT)$/.test(e.target.tagName)) { e.preventDefault(); setPlay(!state.playing); } });

    slider.addEventListener('pointerdown', () => dragging = true);
    addEventListener('pointerup', () => dragging = false);
    slider.addEventListener('input', () => {                 // 하루 중 시각은 유지하고 날짜만 이동
      state.live = false;
      state.T = parseInt(slider.value, 10) + (state.T - Math.floor(state.T));
      onChange();
    });

    const speedBox = $('speedSeg'); speedBox.textContent = '';
    FE.CFG.SPEEDS.forEach(([k, v], i) => {
      const b = document.createElement('button'); b.dataset.s = v; b.dataset.i18n = k; b.dataset.i18nTitle = k + 't'; if (!FE.STR.ko[k + 't']) b.removeAttribute('data-i18n-title');
      if (i === FE.CFG.DEFAULT_SPEED) b.classList.add('on'); speedBox.appendChild(b);
    });
    const speedBtns = [...speedBox.querySelectorAll('button')];
    speedBtns.forEach(b => b.onclick = () => { state.live = false; state.speed = parseFloat(b.dataset.s); speedBtns.forEach(x => x.classList.toggle('on', x === b)); });
    state.speed = FE.CFG.SPEEDS[FE.CFG.DEFAULT_SPEED][1];

    $('btnNow').onclick = () => {                            // 오늘 · 지금 → 실시간(1배) 재생. live: 매 프레임 실제 시계에 맞춤
      state.T = FE.nowT(); state.speed = FE.CFG.SPEEDS[0][1];
      speedBtns.forEach((x, i) => x.classList.toggle('on', i === 0)); setPlay(true); state.live = true; onChange();
    };

    const viewBtns = [...document.querySelectorAll('#viewSeg button[data-v]')], auto = $('btnAuto');
    const mark = v => viewBtns.forEach(x => x.classList.toggle('on', x.dataset.v === v));
    viewBtns.forEach(b => b.onclick = () => { cam.goTo(b.dataset.v); mark(b.dataset.v); });
    auto.onclick = () => { cam.setAuto(!cam.controls.autoRotate); auto.classList.toggle('on', cam.controls.autoRotate); };

    const pt = $('panelToggle'), panel = $('panel');
    const setCollapsed = c => { panel.classList.toggle('collapsed', c); pt.textContent = FE.t(c ? 'expand' : 'collapse'); pt.setAttribute('aria-label', FE.t(c ? 'expandAria' : 'collapseAria')); cam.layout(); };
    pt.onclick = () => setCollapsed(!panel.classList.contains('collapsed'));
    if (innerWidth < 720) panel.classList.add('collapsed');

    return {
      sync(T) { if (!dragging) slider.value = Math.min(365, Math.floor(T)); },
      markView: mark, setPlay,
      relabel() {                                            // 언어가 바뀌면 코드가 직접 쓰는 글자를 다시 쓴다
        play.textContent = FE.t(state.playing ? 'pause' : 'play');
        setCollapsed(panel.classList.contains('collapsed'));
        $('btnLang').textContent = FE.t('langBtn'); $('btnLang').title = FE.t('lang');
      }
    };
  }
};

/* ===== 90 메인: 렌더러 · 카메라 · 루프 · 도시 선택(목록/클릭) ===== */
(function () {
  FE.initLocale();
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060a);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 400);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
  controls.minDistance = 1.35; controls.maxDistance = 14; controls.autoRotateSpeed = 1.4; controls.rotateSpeed = 0.7;

  /* '옆에서 보기': 지축이 항상 오른쪽 위로 기울어 보이도록(보통의 지구본처럼, 북쪽=위, 동쪽=오른쪽) 계절에 따라 보는 쪽을 고른다.
     축은 (sinδ, cosδ, 0) 방향이므로 적위 δ가 +이면 +Z 쪽에서(축이 태양 쪽=오른쪽으로 기움), −이면 −Z 쪽에서 본다(태양은 왼쪽으로 가고 축은 반대로 오른쪽으로 기움). */
  const declNow = () => (window.__lastState ? window.__lastState.decl : FE.Solar.decl(FE.nowT()));
  const VIEWS = { side: () => declNow() >= 0 ? [1.4, 0.9, 4.2] : [1.4, 0.9, -4.2], sun: () => [1, 0.14, 0.05], top: () => [0, 1, 0.002] };
  let tween = null, fit = 4;
  const cam = {
    controls,
    mode: 'side',
    /* 카메라를 지구본 둘레의 호를 따라 이동(반대편으로 갈 때도 지구본을 뚫고 지나가지 않음) */
    goTo(name) {
      cam.mode = name;
      const d = camera.position.length(), from = camera.position.clone().normalize(), to = new THREE.Vector3(...VIEWS[name]()).normalize();
      tween = { t: 0, from, d, q: new THREE.Quaternion().setFromUnitVectors(from, to) };
    },
    setAuto(on) { controls.autoRotate = on; },
    /* 패널·조작바에 가리지 않는 빈 영역의 한가운데에 지구본이 오도록 화면 중심을 옮기고, 거리도 그 영역에 맞춘다 */
    layout() {
      const W = innerWidth, H = innerHeight;
      renderer.setSize(W, H); camera.aspect = W / H;
      const panel = document.getElementById('panel'), bar = document.getElementById('bar'), wide = W >= 720;
      const px = wide ? panel.offsetWidth + 32 : 0;
      const top = wide ? 58 : panel.getBoundingClientRect().bottom + 6;
      const by = bar.offsetHeight + 16;
      document.documentElement.style.setProperty('--barH', bar.offsetHeight + 'px');
      const freeW = Math.max(120, W - px), freeH = Math.max(120, H - by - top);
      camera.setViewOffset(W, H, W / 2 - (W - px) / 2, H / 2 - (top + H - by) / 2, W, H);
      const nf = H / (0.68 * Math.min(freeW, freeH) * Math.tan(camera.fov * Math.PI / 360));
      const k = nf / fit; fit = nf;
      camera.position.multiplyScalar(k); controls.update(); camera.updateProjectionMatrix();
    }
  };

  const lighting = FE.Lighting.create(scene);
  const globe = FE.Globe.create(scene, renderer);
  const panel = FE.Panel.create();
  const rays = FE.Rays.create(scene, globe, lighting);
  const btnRays = document.getElementById('btnRays');
  const setRays = on => { rays.setEnabled(on); btnRays.classList.toggle('on', on); document.body.classList.toggle('rays-on', on); FE.store.set('rays', on ? '1' : '0'); };
  btnRays.onclick = () => setRays(!rays.enabled);
  { const sv = FE.store.get('rays'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; setRays(sv !== null && sv !== undefined ? sv === '1' : !reduce); }

  const state = { T: FE.nowT(), playing: true, speed: FE.CFG.SPEEDS[FE.CFG.DEFAULT_SPEED][1], live: false };
  const refresh = (force) => {
    const st = FE.Solar.state(state.T);
    globe.setState(st); panel.update(st, force); if (ui) ui.sync(state.T);
    window.__lastState = st;
  };
  let ui = null;
  ui = FE.Controls.create(state, cam, () => refresh(true));

  const sel = document.getElementById('citySel');
  sel.onchange = () => FE.pickCity(sel.value);
  document.getElementById('btnLang').onclick = () => FE.setLang(FE.lang === 'ko' ? 'en' : 'ko');
  FE.onChange = () => {                                      // 도시나 언어가 바뀔 때마다 한 번에 갱신
    FE.applyI18n(); FE.buildCitySelect(); globe.setCity(FE.city); panel.setCity(); ui.relabel();
    cam.layout(); refresh(true);
  };

  // 지구본의 도시 점을 눌러 선택(끌어서 돌리는 동작과 구분)
  let down = null; const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', e => {
    if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
    if (moved > 6) { cam.mode = ''; ui.markView(''); return; }        // 끌어서 돌리면 '옆에서 보기' 자동 전환을 멈춤
    if (dt > 500) return;
    const r = cv.getBoundingClientRect();
    const c = globe.pick(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1), camera);
    if (c) FE.pickCity(c.id);
  });

  addEventListener('resize', cam.layout);
  new ResizeObserver(cam.layout).observe(document.getElementById('bar'));
  new ResizeObserver(cam.layout).observe(document.getElementById('panel'));
  FE.onChange();
  camera.position.set(...VIEWS.side()).normalize().multiplyScalar(fit); controls.update();
  ui.markView('side');

  window.__FE = { state, refresh, cam, camera, controls, renderer, scene, globe, lighting, panel, ui, rays };   // 점검용

  const btnFlip = document.getElementById('btnFlip'), toast = document.getElementById('toast'); let toastTimer = 0;
  const showToast = msg => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 4200); };
  let autoFlip = FE.store.get('flip') === '1';
  const setFlip = (on, announce) => { autoFlip = on; btnFlip.classList.toggle('on', on); FE.store.set('flip', on ? '1' : '0'); sideSign = declNow() >= 0; if (on && cam.mode === 'side') cam.goTo('side'); };
  btnFlip.onclick = () => setFlip(!autoFlip);
  const clock = new THREE.Clock(); let time = 0, sideSign = declNow() >= 0; btnFlip.classList.toggle('on', autoFlip);
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1); time += dt;
    if (state.playing) {
      if (state.live) state.T = FE.nowT(); else { state.T += dt * state.speed; if (state.T >= FE.CFG.DAY_WRAP) state.T -= FE.CFG.DAY_WRAP; }
      refresh();
    }
    if (autoFlip && cam.mode === 'side' && !tween && (declNow() >= 0) !== sideSign) { sideSign = declNow() >= 0; cam.goTo('side'); showToast(FE.t('toastFlip')); }   // 계절이 바뀌어 적위 부호가 바뀌면 지축이 계속 오른쪽 위로 보이게 반대편으로 이동
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 0.9); const e = 1 - Math.pow(1 - tween.t, 3);
      const qi = new THREE.Quaternion().slerp(tween.q, e);
      camera.position.copy(tween.from).applyQuaternion(qi).multiplyScalar(tween.d); if (tween.t >= 1) tween = null;
    }
    lighting.update(time); globe.animate(time); if (rays.enabled) rays.update(dt);
    controls.update(); renderer.render(scene, camera);
  });
})();

</script>
</body>
</html>
